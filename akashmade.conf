# -----------------------------------------------------------------------------
# akashmade.conf
# Apache virtual host for akashmade.in on Ubuntu (EC2)
#
# Install:
#   sudo cp akashmade.conf /etc/apache2/sites-available/akashmade.conf
#   sudo a2enmod ssl rewrite headers
#   sudo a2dissite 000-default.conf
#   sudo a2ensite akashmade.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# Note: Certbot (--apache) generates its own akashmade-le-ssl.conf.
# This file shows the same setup written out by hand, so it is easy to read
# and reproduce. If you use Certbot, you do not need to enable both.
# -----------------------------------------------------------------------------

# --- HTTP (port 80): redirect everything to HTTPS ---
<VirtualHost *:80>
    ServerName akashmade.in
    ServerAlias www.akashmade.in

    RewriteEngine On
    RewriteRule ^ https://akashmade.in%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/akashmade-error.log
    CustomLog ${APACHE_LOG_DIR}/akashmade-access.log combined
</VirtualHost>

# --- HTTPS (port 443): serve the website ---
<VirtualHost *:443>
    ServerName akashmade.in
    ServerAlias www.akashmade.in

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # TLS certificate issued by Let's Encrypt (via Certbot)
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/akashmade.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/akashmade.in/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # Basic security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/akashmade-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/akashmade-ssl-access.log combined
</VirtualHost>
